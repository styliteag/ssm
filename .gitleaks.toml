# GitLeaks config for the CI full-history scan (security-scan.yml).
# Allowlists are deliberately reviewed one by one — fake fixtures and retired
# material only. Nothing live is suppressed here.

[extend]
useDefault = true

[allowlist]
description = "Reviewed test fixtures, documented example values, retired material"
paths = [
  # Rust-era test suites (deleted from the tree, still in history): fake
  # passwords/keys constructed inline for HTTP auth tests.
  '''backend/src/tests/.*''',
  # Python-era contract tests (deleted): fake JWT secrets / dummy credentials.
  '''backend/tests/.*''',
  # Old API doc (deleted): example request bodies with placeholder passwords.
  '''docs/API\.md''',
  # Secret-scanner fixtures: files that exist to hold fake secret-shaped
  # strings for testing the pre-commit hook and its whitelist.
  '''test-allowlisted\.txt''',
  '''\.secrets-whitelist''',
  # Operating manual documents the whitelist example values verbatim.
  '''AGENTS\.md''',
  '''CLAUDE\.md''',
]
# ExUnit fixtures use the bare ssh key-type prefix as key material — not a secret.
regexes = [
  '''AAAAC3NzaC1lZDI1NTE5"?,?$''',
]
# Retired key material from one historical commit, confirmed no longer accepted
# anywhere. The path never returns: that directory was deleted with the python
# stack, so a re-added key would land elsewhere and still fail the scan.
commits = [
  "3f1a8562be7f455320736f86eb159b384eef1f2d",
]
