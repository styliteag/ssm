# Production deployment for the all-in-one Elixir/Phoenix image.
#
# Build context is the repository root (mix.exs reads ../VERSION). The
# container serves the LiveView UI and the /api/v2 JSON API on port 80 and
# applies database migrations on start — the ecto baseline adopts
# Diesel-/Alembic-era databases in place, so the data volumes from the
# previous python/react image keep working unchanged.

services:
  ssm:
    container_name: ssm
    build:
      context: ..
      dockerfile: phoenix/Dockerfile
    image: ssm:latest
    ports:
      - "80:80"
    volumes:
      - ./data/db:/app/db
      - ./data/config:/app/config
      - ./data/keys:/app/keys
      - ./data/logs:/app/logs
    environment:
      - DATABASE_URL=sqlite:////app/db/ssm.db
      - HTPASSWD=/app/config/.htpasswd
      - SSH_KEY=keys/id_ssm
      # JWT_SECRET MUST be set (32+ chars); SESSION_KEY is accepted as alias.
      # It signs API bearer tokens and derives the session cookie secret.
      # - JWT_SECRET=replace-me-with-a-long-random-string
      - LOGLEVEL=info
    networks:
      - ssm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/bin/health-check.sh"]
      start_period: 30s
      timeout: 10s
      interval: 30s
      retries: 3

networks:
  ssm-network:
    driver: bridge
